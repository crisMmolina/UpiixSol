# Render Blueprint (UPS-030): UpiixSol on one free web service. Postgres lives on Neon (free) and uploads
# are stored in it (MEDIA_STORAGE=database), because the free Render disk is wiped on every restart.
# Step by step: docs/deploy-render.md
services:
  - type: web
    name: upiixsol
    runtime: docker
    plan: free
    region: ohio # same region as the Neon project (AWS us-east-2)
    dockerfilePath: ./Dockerfile # last stage: `single` (API + built SPA)
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: prod
      - key: DATABASE_URL # Neon direct connection string; the entrypoint adds the psycopg driver
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEFAULT_PASSWORD # first password of the 6 seeded accounts; read it in the dashboard
        generateValue: true
      - key: SEED_ON_START # set to false after the first deploy (docs/deploy-render.md §4)
        value: "true"
      - key: REQUIRE_PASSWORD_CHANGE
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: RATELIMIT_ENABLED
        value: "true"
      - key: MEDIA_STORAGE
        value: database
      # Only Render's proxy reaches the container (see deploy/entrypoint.sh for the rate-limit trade-off).
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Email (spec 003, docs/mail-mailgun.md). Keys are set by hand in the dashboard (sync: false).
      - key: MAIL_ENABLED # set by hand ("false" = off, also the rollback); value-less so a redeploy never overrides it
        sync: false
      - key: MAIL_BACKEND
        value: mailgun
      - key: MAILGUN_DOMAIN
        value: mg.upiixsol.com
      - key: MAILGUN_API_BASE # EU region: https://api.eu.mailgun.net
        value: https://api.mailgun.net
      - key: MAILGUN_API_KEY # sending key of the domain
        sync: false
      - key: MAILGUN_WEBHOOK_SIGNING_KEY
        sync: false
      - key: MAILGUN_TEST_MODE # set by hand: "true" for the first tests
        sync: false
      - key: MAIL_FROM
        value: UpiixSol <avisos@mg.upiixsol.com>
      - key: MAIL_MONTHLY_LIMIT # Mailgun Free: 3000 a month
        value: "3000"
      - key: MAIL_PERIOD_START_DAY # day the billing period starts (Mailgun > Billing), 1-28 UTC
        value: "1"
      - key: PUBLIC_BASE_URL
        value: https://www.upiixsol.com

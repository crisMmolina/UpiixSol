# UpiixSol Campus · nginx in front of the API (UPS-015).
# Serves the built SPA and /media from disk, proxies /api to uvicorn. TLS goes in front of this
# (see docs/runbook.md §TLS); this server only listens on plain HTTP inside the host.

server_tokens off;

upstream api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same cap as app/body_limit.py (6 MB: largest upload + form overhead).
    client_max_body_size 6m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (never append): a client-sent X-Forwarded-For must not choose the rate-limit key.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Uploads: random names (/media/<kind>/<uuid>.<ext>), so they are immutable. Same sandbox CSP as
    # app/main.py MEDIA_CSP: an uploaded file (even SVG) can never run scripts.
    location /media/ {
        alias /srv/media/;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        autoindex off;
        try_files $uri =404;
    }

    # Vite assets carry a content hash in their name.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: unknown paths fall back to index.html (client routing); index.html is never cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

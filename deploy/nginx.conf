# UpiixSol Campus · nginx in front of the API (UPS-015).
# Serves the built SPA and /media from disk, proxies /api to uvicorn. TLS goes in front of this
# (see docs/runbook.md §TLS); this server only listens on plain HTTP bound to the host's loopback.

server_tokens off;

# Client IP for the API's rate limit (5/min/IP). Traffic reaches nginx through the published port, so
# nginx sees the `edge` network gateway, never the client. Only the host's TLS terminator can connect
# there (the port binds to 127.0.0.1, see HTTP_BIND), so its X-Forwarded-For is trusted. Without
# recursion nginx takes the last address, the one the terminator added, even if a client sent its own.
set_real_ip_from 172.31.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

# Scheme the client used: the terminator's X-Forwarded-Proto when valid, otherwise this hop's scheme.
map $http_x_forwarded_proto $client_scheme {
    "~^https?$" $http_x_forwarded_proto;
    default     $scheme;
}

upstream api {
    server api:8000;
    keepalive 16;
    # uvicorn closes idle connections after 5 s; close ours first so a POST never hits a dead socket.
    keepalive_timeout 4s;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same cap as app/body_limit.py (6 MB: largest upload + form overhead).
    client_max_body_size 6m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # The app sets these headers itself; hide its copies so each appears once. nginx's own
        # responses (413, 502...) still get them from the include.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (never append) with the client IP resolved above: a client-sent X-Forwarded-For
        # never chooses the rate-limit key.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Uploads: random names (/media/<kind>/<uuid>.<ext>), so they are immutable. Same sandbox CSP as
    # app/main.py MEDIA_CSP: an uploaded file (even SVG) can never run scripts.
    location /media/ {
        alias /srv/media/;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        autoindex off;
        try_files $uri =404;
    }

    # Vite assets carry a content hash in their name.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: unknown paths fall back to index.html (client routing); index.html is never cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
